name: Build and Deploy to GCE

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_assets:
        description: Re-upload every image asset, even if the server already has them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maayuan-links-production
  cancel-in-progress: true

env:
  DEPLOY_HOST: ${{ secrets.VPS_HOST_C }}
  DEPLOY_USER: ${{ secrets.VPS_USER_C }}
  DEPLOY_PORT: ${{ secrets.VPS_PORT_C || '22' }}
  DEPLOY_DIR: /var/www/maayuan-links
  FORCE_ASSETS: ${{ github.event.inputs.force_assets }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Bounded on purpose: a degraded runner -> server link must fail fast instead of hanging for hours.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check source files
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Report payload size
        run: |
          du -sh dist
          echo "files: $(find dist -type f | wc -l)"

      - name: Prepare deploy SSH key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY_C }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" || { echo "::error::VPS_SSH_KEY_C is empty or unavailable. Add it as a repository secret."; exit 1; }
          case "$DEPLOY_KEY" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"*|"-----BEGIN RSA PRIVATE KEY-----"*) ;;
            *) echo "::error::VPS_SSH_KEY_C must contain the complete private key, including BEGIN and END lines."; exit 1 ;;
          esac
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null
          cat >> "$HOME/.ssh/config" <<EOF
          Host maayuan-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile $HOME/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 15
            ServerAliveCountMax 8
            ConnectTimeout 20
            Compression no
            IPQoS cs0
          EOF
          chmod 600 "$HOME/.ssh/config"

      # The 23 random logos are 8.5 MB of the 9.4 MB payload and almost never change, so the image
      # bytes are hashed on both sides and re-sent only when they really differ. The remote script
      # is read from stdin, and any hashing failure there yields an empty value => full re-upload.
      - name: Decide whether image assets need uploading
        id: assets
        run: |
          set -euo pipefail
          if command -v sha256sum > /dev/null 2>&1; then sum="sha256sum"; else sum="shasum -a 256"; fi
          local_rev="$(cd dist && find assets -type f -exec $sum {} + | awk '{print $1, $2}' | LC_ALL=C sort | $sum | cut -d' ' -f1)"
          test -n "$local_rev"
          remote_rev="$(ssh maayuan-deploy "bash -s -- '$DEPLOY_DIR'" <<'REMOTE'
          cd "$1" 2>/dev/null || exit 0
          if command -v sha256sum > /dev/null 2>&1; then sum="sha256sum"; else sum="shasum -a 256"; fi
          test -d assets || exit 0
          find assets -type f -exec $sum {} + | awk '{print $1, $2}' | LC_ALL=C sort | $sum | cut -d' ' -f1
          REMOTE
          )"
          if [ "${FORCE_ASSETS:-}" = "true" ]; then
            changed=true
            reason="force_assets was requested"
          elif [ -n "$remote_rev" ] && [ "$remote_rev" = "$local_rev" ]; then
            changed=false
            reason="the live copy already matches ($local_rev)"
          else
            changed=true
            reason="the live copy differs (${remote_rev:-none} -> $local_rev)"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Image assets: $reason"

      # ~6 KB over one SSH stream: seconds even on a congested cross-border link.
      - name: Publish HTML, CSS and JS
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/text.tar.gz" -C dist index.html styles.css app.js
          bytes="$(wc -c < "$RUNNER_TEMP/text.tar.gz")"
          start=$SECONDS
          cat "$RUNNER_TEMP/text.tar.gz" | ssh maayuan-deploy "
            set -eu
            install -d -m 0755 '$DEPLOY_DIR'
            rm -rf '$DEPLOY_DIR/.text-incoming'
            mkdir -p '$DEPLOY_DIR/.text-incoming'
            tar -xzf - -C '$DEPLOY_DIR/.text-incoming'
            test -s '$DEPLOY_DIR/.text-incoming/index.html'
            find '$DEPLOY_DIR' -maxdepth 1 -type f -delete
            mv -f '$DEPLOY_DIR/.text-incoming/index.html' '$DEPLOY_DIR/.text-incoming/styles.css' '$DEPLOY_DIR/.text-incoming/app.js' '$DEPLOY_DIR/'
            rm -rf '$DEPLOY_DIR/.text-incoming'
          "
          elapsed=$((SECONDS - start))
          echo "Published ${bytes} bytes of HTML/CSS/JS in ${elapsed}s (~$((bytes / 1024 / (elapsed > 0 ? elapsed : 1))) KiB/s)"

      - name: Publish image assets
        if: steps.assets.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/assets.tar.gz" -C dist assets
          bytes="$(wc -c < "$RUNNER_TEMP/assets.tar.gz")"
          start=$SECONDS
          echo "Uploading ${bytes} bytes of image assets ..."
          # Unpack next to the live folder and swap by rename, so the site never serves missing logos.
          cat "$RUNNER_TEMP/assets.tar.gz" | ssh maayuan-deploy "
            set -eu
            install -d -m 0755 '$DEPLOY_DIR'
            rm -rf '$DEPLOY_DIR/.assets-incoming' '$DEPLOY_DIR/.assets-previous'
            mkdir -p '$DEPLOY_DIR/.assets-incoming'
            tar -xzf - -C '$DEPLOY_DIR/.assets-incoming'
            test -d '$DEPLOY_DIR/.assets-incoming/assets/images/maayuan'
            mv '$DEPLOY_DIR/assets' '$DEPLOY_DIR/.assets-previous' 2>/dev/null || true
            mv '$DEPLOY_DIR/.assets-incoming/assets' '$DEPLOY_DIR/assets'
            rm -rf '$DEPLOY_DIR/.assets-previous' '$DEPLOY_DIR/.assets-incoming'
          "
          elapsed=$((SECONDS - start))
          echo "Published ${bytes} bytes of image assets in ${elapsed}s (~$((bytes / 1024 / (elapsed > 0 ? elapsed : 1))) KiB/s)"

      - name: Verify deployed release
        run: |
          set -eu
          ssh maayuan-deploy "
            set -eu
            test -s '$DEPLOY_DIR/index.html'
            test -s '$DEPLOY_DIR/styles.css'
            test -s '$DEPLOY_DIR/app.js'
            test -d '$DEPLOY_DIR/assets/images/maayuan'
            test -d '$DEPLOY_DIR/assets/images/links'
            echo '✅ Deployed to $DEPLOY_DIR'
          "
