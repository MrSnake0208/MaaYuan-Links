name: Build and Deploy to GCE

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maayuan-links-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check source files
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Upload release to temporary folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_C }}
          username: ${{ secrets.VPS_USER_C }}
          key: ${{ secrets.VPS_SSH_KEY_C }}
          source: "./dist/*"
          target: "/tmp/maayuan-links_tmp/"
          overwrite: true
          strip_components: 1

      - name: Switch release on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_C }}
          username: ${{ secrets.VPS_USER_C }}
          key: ${{ secrets.VPS_SSH_KEY_C }}
          envs: DEPLOY_DIR
          script: |
            set -eu
            test -d /tmp/maayuan-links_tmp
            install -d -m 0755 "$DEPLOY_DIR"
            find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a /tmp/maayuan-links_tmp/. "$DEPLOY_DIR"/
            rm -rf /tmp/maayuan-links_tmp
            echo "✅ Deployed to $DEPLOY_DIR"
        env:
          DEPLOY_DIR: /var/www/maayuan-links
